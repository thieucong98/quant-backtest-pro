services:
  quant-backtest-pro:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-backtest-pro
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - STATIC_PATH=/app/dist
      - DATABASE_URL="file:./prisma/dev.db"
    volumes:
      - sqlite_data:/app/server/prisma
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  sqlite_data:
    driver: local
