<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" fill="none">
  <rect width="960" height="320" rx="16" fill="#0B0E14" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="956" height="316" rx="14" fill="url(#bg_mesh)" fill-opacity="0.25"/>
  
  <!-- Glowing Accents -->
  <circle cx="120" cy="80" r="160" fill="#38BDF8" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="840" cy="240" r="180" fill="#6366F1" fill-opacity="0.08" filter="blur(60px)"/>

  <!-- Badge Header -->
  <rect x="60" y="45" width="220" height="30" rx="15" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
  <text x="75" y="65" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">QUARTERLY TOURNAMENT</text>

  <!-- Title & Subtitle -->
  <text x="60" y="125" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Global Quant Backtest Challenge</text>
  <text x="60" y="160" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">Prove your algorithmic edge with zero curve-fitting. 100% reproducible cryptographic seeds.</text>

  <!-- Stat Badges -->
  <g transform="translate(60, 200)">
    <!-- Prize Pool -->
    <rect width="180" height="70" rx="10" fill="#10141E" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">PRIZE POOL</text>
    <text x="18" y="55" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700">$50,000 USD</text>

    <!-- Evaluation Engine -->
    <g transform="translate(200, 0)">
      <rect width="200" height="70" rx="10" fill="#10141E" stroke="#1E293B" stroke-width="1.5"/>
      <text x="18" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">VERIFICATION</text>
      <text x="18" y="55" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="700">SHA-256 Seeded</text>
    </g>

    <!-- Scoring Engine -->
    <g transform="translate(420, 0)">
      <rect width="220" height="70" rx="10" fill="#10141E" stroke="#1E293B" stroke-width="1.5"/>
      <text x="18" y="30" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">SCORING METRIC</text>
      <text x="18" y="55" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700">Sharpe + Calmar + DD</text>
    </g>
  </g>

  <!-- Decorative Chart Graphic -->
  <g transform="translate(730, 80)">
    <path d="M0 140 Q 40 110, 70 80 T 130 50 T 170 20" stroke="#10B981" stroke-width="3" fill="none"/>
    <path d="M0 140 Q 40 110, 70 80 T 130 50 T 170 20 L 170 160 L 0 160 Z" fill="url(#chart_grad)" fill-opacity="0.15"/>
    <circle cx="170" cy="20" r="5" fill="#10B981"/>
  </g>

  <defs>
    <linearGradient id="bg_mesh" x1="0" y1="0" x2="960" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#0B0E14"/>
    </linearGradient>
    <linearGradient id="chart_grad" x1="0" y1="20" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10B981"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
