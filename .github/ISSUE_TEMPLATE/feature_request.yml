name: 💡 Feature Request / Indicator Idea
description: Suggest an idea, quantitative indicator, or bot exporter feature
title: "[FEAT]: "
labels: ["enhancement", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature to make **Quant Backtest Pro** even better!
  - type: input
    id: feature-title
    attributes:
      label: Feature / Indicator Name
      placeholder: e.g., Add Volume Profile / Order Flow Footprint or cTrader Exporter
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation (e.g. I'm always frustrated when...)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: Detailed description of the feature, quantitative math formula, UI mockups, or algorithm specifications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've considered.
