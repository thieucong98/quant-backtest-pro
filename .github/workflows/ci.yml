name: CI - Build & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build & TypeScript Verification
        run: npm run build

      - name: Run Automated Comprehensive Test Suite
        run: npm test

      - name: Verify Server Build
        working-directory: ./server
        run: |
          npm install
          npx prisma generate
          npm run build


